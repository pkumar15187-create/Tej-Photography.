<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%" style="background-color: #ffffff; border-radius: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- PhonePe Header Banner -->
  <g transform="translate(0, 0)">
    <!-- Top curved edge to align inside cards -->
    <path d="M 0,20 Q 0,0 20,0 L 480,0 Q 500,0 500,20 L 500,160 L 0,160 Z" fill="#ffffff" />
    
    <!-- PhonePe Circle Logo (Purple) -->
    <circle cx="170" cy="75" r="30" fill="#5f259f" />
    <!-- White symbol "pe" (पे) in Devnagari as seen in original logo -->
    <text x="156" y="85" font-size="34" font-weight="900" fill="#ffffff" font-family="'Inter', Helvetica, sans-serif">पे</text>
    
    <!-- "PhonePe" text -->
    <text x="215" y="85" font-size="36" font-weight="800" fill="#2d2d2d" letter-spacing="-0.5">PhonePe</text>
  </g>

  <!-- ACCEPTED HERE Subtitle -->
  <text x="250" y="165" font-size="19" font-weight="800" fill="#5f259f" text-anchor="middle" letter-spacing="1.2">ACCEPTED HERE</text>
  
  <!-- "Scan & Pay Using PhonePe App" Caption -->
  <text x="250" y="200" font-size="14" font-weight="500" fill="#444444" text-anchor="middle" letter-spacing="0.2">Scan &amp; Pay Using PhonePe App</text>
  
  <!-- QR Code Section Wrapper -->
  <g transform="translate(75, 235)">
    <!-- QR Outer Area Border -->
    <rect x="-10" y="-10" width="370" height="370" fill="transparent" stroke="#e0e0e0" stroke-width="1" rx="10" />

    <!-- Square QR Finder Patterns (Top-Left, Top-Right, Bottom-Left) -->
    <!-- Top-Left Finder -->
    <rect x="10" y="10" width="70" height="70" fill="#1c1a22" rx="4" />
    <rect x="20" y="20" width="50" height="50" fill="#ffffff" rx="2" />
    <rect x="30" y="30" width="30" height="30" fill="#1c1a22" rx="1" />
    
    <!-- Top-Right Finder -->
    <rect x="270" y="10" width="70" height="70" fill="#1c1a22" rx="4" />
    <rect x="280" y="20" width="50" height="50" fill="#ffffff" rx="2" />
    <rect x="290" y="30" width="30" height="30" fill="#1c1a22" rx="1" />
    
    <!-- Bottom-Left Finder -->
    <rect x="10" y="270" width="70" height="70" fill="#1c1a22" rx="4" />
    <rect x="20" y="280" width="50" height="50" fill="#ffffff" rx="2" />
    <rect x="30" y="290" width="30" height="30" fill="#1c1a22" rx="1" />

    <!-- Aligners & Timing Patterns -->
    <rect x="275" y="275" width="25" height="25" fill="#1c1a22" rx="2" />
    <rect x="280" y="280" width="15" height="15" fill="#ffffff" rx="1" />
    <rect x="285" y="285" width="5" height="5" fill="#1c1a22" />

    <!-- Realistic QR pattern matrix distribution using SVGs -->
    <g fill="#1c1a22">
      <!-- Row 1 & 2 blocks -->
      <rect x="100" y="10" width="10" height="20" />
      <rect x="120" y="20" width="30" height="10" />
      <rect x="160" y="10" width="10" height="10" />
      <rect x="180" y="20" width="20" height="10" />
      <rect x="210" y="10" width="10" height="30" />
      <rect x="230" y="20" width="20" height="10" />

      <!-- Row 3 & 4 blocks -->
      <rect x="90" y="50" width="20" height="10" />
      <rect x="120" y="40" width="10" height="30" />
      <rect x="140" y="60" width="30" height="10" />
      <rect x="180" y="50" width="10" height="20" />
      <rect x="200" y="40" width="20" height="10" />
      <rect x="230" y="60" width="10" height="20" />
      <rect x="250" y="50" width="10" height="10" />

      <!-- Row 5 & 6 blocks -->
      <rect x="10" y="90" width="40" height="10" />
      <rect x="60" y="100" width="10" height="20" />
      <rect x="80" y="90" width="30" height="10" />
      <rect x="120" y="100" width="20" height="10" />
      <rect x="150" y="90" width="10" height="35" />
      <rect x="170" y="110" width="30" height="10" />
      <rect x="210" y="90" width="15" height="15" />
      <rect x="240" y="100" width="10" height="30" />
      <rect x="260" y="90" width="35" height="10" />
      <rect x="310" y="100" width="30" height="10" />

      <!-- Row 7 & 8 blocks -->
      <rect x="20" y="120" width="15" height="15" />
      <rect x="50" y="130" width="30" height="10" />
      <rect x="90" y="120" width="10" height="20" />
      <rect x="110" y="140" width="25" height="10" />
      <rect x="190" y="130" width="30" height="10" />
      <rect x="230" y="140" width="15" height="15" />
      <rect x="260" y="120" width="10" height="30" />
      <rect x="280" y="130" width="40" height="10" />

      <!-- Row 9 & 10 blocks -->
      <rect x="10" y="160" width="20" height="10" />
      <rect x="40" y="170" width="10" height="30" />
      <rect x="60" y="160" width="35" height="10" />
      <rect x="100" y="180" width="15" height="15" />
      <rect x="220" y="160" width="25" height="10" />
      <rect x="250" y="170" width="10" height="30" />
      <rect x="270" y="160" width="30" height="10" />
      <rect x="310" y="170" width="20" height="10" />

      <!-- Row 11 & 12 blocks -->
      <rect x="15" y="210" width="30" height="10" />
      <rect x="60" y="200" width="15" height="15" />
      <rect x="90" y="210" width="40" height="10" />
      <rect x="140" y="200" width="10" height="30" />
      <rect x="190" y="210" width="30" height="10" />
      <rect x="230" y="200" width="15" height="15" />
      <rect x="260" y="210" width="40" height="10" />
      <rect x="310" y="200" width="10" height="30" />

      <!-- Row 13 & 14 blocks -->
      <rect x="90" y="240" width="20" height="10" />
      <rect x="120" y="235" width="10" height="25" />
      <rect x="150" y="250" width="35" height="10" />
      <rect x="190" y="240" width="10" height="30" />
      <rect x="210" y="250" width="20" height="10" />
      <rect x="240" y="235" width="15" height="15" />

      <!-- Row 15 & 16 blocks -->
      <rect x="90" y="280" width="45" height="10" />
      <rect x="150" y="270" width="10" height="30" />
      <rect x="170" y="280" width="30" height="10" />
      <rect x="210" y="270" width="10" height="20" />
      <rect x="230" y="290" width="25" height="10" />

      <!-- Row 17 & 18 blocks (Bottom row specs) -->
      <rect x="90" y="320" width="20" height="15" />
      <rect x="120" y="310" width="30" height="10" />
      <rect x="160" y="330" width="40" height="10" />
      <rect x="210" y="320" width="10" height="20" />
      <rect x="230" y="310" width="35" height="10" />
    </g>

    <!-- CENTER PRECISE PHONEPE BADGE -->
    <!-- Circular Black Outline Wrapper -->
    <circle cx="175" cy="175" r="32" fill="#1c1a22" />
    <circle cx="175" cy="175" r="28" fill="#ffffff" />
    
    <!-- Purple phonepe badge background -->
    <circle cx="175" cy="175" r="24" fill="#5f259f" />
    <!-- White symbol pe (पे) inside dynamic badge center -->
    <text x="164" y="183" font-size="26" font-weight="900" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif">पे</text>
  </g>
</svg>
